{% extends "base.html" %}
{% from "macros/post_card.html" import render_post%}

{% block content %}
    <h1>All Blog Posts</h1>

    {% if posts %}
        <p>Posts found</p>

        {% for post in posts %}
            {{render_post(post)}}
        {% endfor %}
    {% else %}
        <p>No posts found</p>
    {% endif %}
{% endblock %}
